# shorts-pipeline config for RideSentinel driver tips (en). Used with `uv run shorts --config <this file> ...`.
# NEVER run `shorts publish` with it: that uploads to the YouTube channel of the token in the environment (Bidew Builds).
# Publishing goes through `daily.py publish-tip` (Postiz, RideSentinel accounts only).
channel:
  name: RideSentinel
  brief: 'Daily 30–50 second tips for rideshare and delivery drivers (Uber, Lyft and similar apps), mostly in Montreal and North America. Each short teaches ONE concrete, usable idea to earn more per hour
    or waste less: count the pickup and the drive back, know your own minimum $/hour, dead zones, airport queues, surge math, EV charging time, fuel and wear per km, taxes and mileage records, rest and
    safety. Plain words, a driver talking to drivers, no hype, no invented statistics; when you need a number, make it an obvious worked example. Never advise breaking platform rules, never suggest touching
    the phone while driving, never show a platform''s logo or UI.'
  audience: rideshare and delivery drivers
  language: en
  cta: Follow for one driver tip a day.
  disclosure: 'Voice: AI clone of the founder of RideSentinel. Independent project, not affiliated with Uber or Lyft.'
video:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 58
  min_seconds: 15
  caption_band:
    top: 1400
    bottom: 1560
  safe_top: 200
