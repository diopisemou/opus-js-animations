# RideSentinel daily content. Secrets come from the environment (ELEVENLABS_API_KEY, POSTIZ_API_KEY), never from here.
brief: >
  Daily 20–40 second shorts for rideshare and delivery drivers (Uber, Lyft and similar apps), mostly in Montreal and other
  North American cities. Each video teaches drivers to judge an offer by its real hourly rate: the pickup and the empty drive
  back cost time, a big fare can pay little, a small fare can be great. RideSentinel is an Android app in development that
  reads the offer and shows that rate in one second; early access at ridesentinel.app. Tone: a driver talking to drivers,
  plain words, no hype.
rules:
  - "Every offer is an EXAMPLE (the video says so on screen). Never claim real earnings, never invent statistics or studies."
  - "Numbers on screen and in the voice come from `daily.py calc`; never type a different figure."
  - "Never show or name a platform's logo or UI; say 'the app' or 'the offer', not a brand's screen."
  - "Safety: decisions happen stopped or parked; never suggest touching the phone while driving."
  - "Never advise drivers to break platform rules (acceptance-rate tricks, fake cancels). Respect that each driver sets their own bar."
  - "RideSentinel is in development (Android, early access). Do not promise features, prices or dates."
  - "Voice is the founder's AI voice clone; the on-screen tag and the caption disclose it."
default_bar: 40
max_words: 95
min_seconds: 15
max_seconds: 58
voices:          # the founder's cloned voices (ElevenLabs voice ids)
