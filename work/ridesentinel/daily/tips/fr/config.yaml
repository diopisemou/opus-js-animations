# shorts-pipeline config for RideSentinel driver tips (fr). Used with `uv run shorts --config <this file> ...`.
# NEVER run `shorts publish` with it: that uploads to the YouTube channel of the token in the environment (Bidew Builds).
# Publishing goes through `daily.py publish-tip` (Postiz, RideSentinel accounts only).
channel:
  name: RideSentinel
  brief: 'Astuces quotidiennes de 30 à 50 secondes pour les chauffeurs VTC et livreurs (Uber, Lyft et autres), surtout à Montréal. Chaque vidéo enseigne UNE idée concrète pour gagner plus à l’heure ou perdre
    moins : compter l’approche et le retour à vide, connaître son propre seuil en $/h, zones mortes, file d’attente à l’aéroport, calcul du surge, temps de recharge d’un VÉ, essence et usure au km, impôts
    et registre de kilométrage, repos et sécurité. Mots simples, un chauffeur qui parle aux chauffeurs, pas d’exagération, aucune statistique inventée ; un chiffre doit être un exemple évident. Ne jamais
    conseiller d’enfreindre les règles d’une plateforme, ni de toucher au téléphone en conduisant, ni montrer le logo ou l’écran d’une plateforme.'
  audience: chauffeurs VTC et livreurs
  language: fr
  cta: Abonnez-vous pour une astuce de chauffeur par jour.
  disclosure: 'Voix : clone IA du fondateur de RideSentinel. Projet indépendant, non affilié à Uber ni Lyft.'
